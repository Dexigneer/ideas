<title>Mona Prompt Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: game "mission select" — sticky filter rail + scrollable video list on the left, the selected video's shots on the right; one column on phones. */
:root{
  --bg:#F4EEE3; --surface:#FFFCF6; --sunk:#EDE5D7; --ink:#241A1E; --muted:#6D6166; --line:#DFD3C1;
  --accent:#C8102E; --accent-ink:#FFFFFF; --accent-soft:#F7D9DD;
  --sub:#FFE94A; --band:#1C1518;
  --a:#B5562B; --b:#C8102E; --c:#2F6B4F;
  --ok:#2F6B4F;
  --f-display:"Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#16111A; --surface:#211A24; --sunk:#1A141D; --ink:#F2EBE1; --muted:#A99BA4; --line:#3A2F3D;
  --accent:#FF5267; --accent-ink:#1A0E12; --accent-soft:#3E1B24;
  --sub:#FFE94A; --band:#0B080C;
  --a:#E39264; --b:#FF5267; --c:#5DB08A; --ok:#5DB08A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#16111A; --surface:#211A24; --sunk:#1A141D; --ink:#F2EBE1; --muted:#A99BA4; --line:#3A2F3D;
  --accent:#FF5267; --accent-ink:#1A0E12; --accent-soft:#3E1B24;
  --sub:#FFE94A; --band:#0B080C;
  --a:#E39264; --b:#FF5267; --c:#5DB08A; --ok:#5DB08A; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5; margin:0}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
button,input,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.app{display:grid; grid-template-columns:minmax(300px,360px) minmax(0,1fr); gap:0; min-height:100%}
.rail{position:sticky; top:env(safe-area-inset-top,0px); height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; border-right:1px solid var(--line); background:var(--sunk); min-width:0}
.rail-head{padding-block:18px 12px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:16px; display:flex; flex-direction:column; gap:12px; border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.brand h1{font-family:var(--f-display); font-weight:700; font-size:21px; letter-spacing:.02em; margin:0; text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand small{font-family:var(--f-mono); font-size:11px; color:var(--muted)}
.tabs{display:flex; gap:6px}
.tab{flex:1; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 8px; font-family:var(--f-display); font-weight:600; font-size:13px; letter-spacing:.04em; text-transform:uppercase; cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.seg{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:3px}
.seg button{border:0; background:transparent; border-radius:6px; padding:6px 4px; font-family:var(--f-display); font-weight:700; font-size:13px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.row{display:flex; gap:6px; flex-wrap:wrap}
.row > *{flex:1 1 120px; min-width:0}
input[type=search],select{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 10px; font-size:14px}
.check{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); cursor:pointer}
.count{font-family:var(--f-mono); font-size:11px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
.list{overflow-y:auto; flex:1; padding-block:6px 24px; padding-left:max(8px, env(safe-area-inset-left,0px)); padding-right:8px}
.group-label{font-family:var(--f-display); font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding:14px 8px 6px}
.item{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; width:100%; text-align:left; border:0; background:transparent; border-radius:8px; padding:8px; cursor:pointer}
.item:hover{background:var(--surface)}
.item[aria-current="true"]{background:var(--surface); box-shadow:inset 3px 0 0 var(--accent)}
.code{font-family:var(--f-mono); font-size:12px; font-weight:500; padding:2px 6px; border-radius:5px; color:var(--bg); background:var(--a); min-width:44px; text-align:center}
.code.B{background:var(--b)} .code.C{background:var(--c)}
.item-title{font-size:14px; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.item-meta{font-family:var(--f-mono); font-size:11px; color:var(--muted); white-space:nowrap}
.item.done .item-title{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line)}
.tick{color:var(--ok); font-weight:700}

.main{min-width:0; padding-block:22px 64px; padding-left:24px; padding-right:max(16px, env(safe-area-inset-right,0px))}
.wrap{max-width:900px; display:flex; flex-direction:column; gap:18px}
.btn.back{display:none}
.vhead{display:flex; flex-direction:column; gap:8px}
.eyebrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.vhead h2{font-family:var(--f-display); font-weight:700; font-size:clamp(24px,3.2vw,34px); line-height:1.1; margin:0; text-wrap:balance}
.slogan{font-family:var(--f-display); font-weight:600; color:var(--accent); font-size:14px; letter-spacing:.03em}
.actions{display:flex; gap:8px; flex-wrap:wrap}
.btn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:8px 12px; font-weight:700; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.small{padding:5px 9px; font-size:12px}
.btn.ok{background:var(--ok); color:var(--bg); border-color:var(--ok)}
.info{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px}
.info-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:6px; min-width:0}
.label{font-family:var(--f-display); font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:8px}
.info-card p{margin:0; overflow-wrap:anywhere}

.shots{display:flex; flex-direction:column; gap:14px}
.shot{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; min-width:0}
.shot.copied{border-color:color-mix(in srgb, var(--ok) 55%, var(--line))}
.shot-top{display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 12px; border-bottom:1px solid var(--line)}
.sid{font-family:var(--f-display); font-weight:700; font-size:14px; background:var(--ink); color:var(--bg); padding:2px 8px; border-radius:5px; letter-spacing:.04em}
.tc{font-family:var(--f-mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.refs{display:flex; gap:5px; flex-wrap:wrap; margin-left:auto}
.ref{font-family:var(--f-mono); font-size:11px; border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--muted); background:var(--sunk)}
.sub{background:var(--band); padding:10px 14px; text-align:center}
.sub span{font-family:var(--f-body); font-weight:700; font-size:16px; color:var(--sub); text-shadow:-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; overflow-wrap:anywhere}
.prompt{position:relative; padding:12px 12px 12px 14px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:start}
.prompt pre{margin:0; font-family:var(--f-mono); font-size:12.5px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--ink)}
.copy{border:0; background:var(--accent); color:var(--accent-ink); font-family:var(--f-display); font-weight:700; letter-spacing:.06em; font-size:13px; padding:9px 14px; border-radius:8px; cursor:pointer; white-space:nowrap}
.copy.done{background:var(--ok); color:var(--bg)}
.notes{display:flex; flex-direction:column; gap:8px}
.note{display:grid; grid-template-columns:140px minmax(0,1fr) auto; gap:10px; align-items:start; padding:10px 0; border-top:1px solid var(--line)}
.note b{font-family:var(--f-display); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.note span{overflow-wrap:anywhere}
.empty{color:var(--muted); padding:40px 0}
.sheet-group{font-family:var(--f-display); font-size:20px; font-weight:700; margin:18px 0 4px}
.toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 14px; border-radius:8px; font-weight:700; font-size:14px; z-index:20; pointer-events:none; opacity:0; transition:opacity .15s}
.toast.show{opacity:1}
.fallback{width:100%; min-height:120px; font-family:var(--f-mono); font-size:12px; border:1px solid var(--accent); border-radius:8px; padding:8px; background:var(--surface)}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static; height:auto; border-right:0}
  .list{max-height:none; overflow:visible}
  .app.detail .rail{display:none}
  .app:not(.detail) .main{display:none}
  .main{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-block:16px 64px}
  .btn.back{display:inline-flex}
  .note{grid-template-columns:minmax(0,1fr) auto}
  .note b{grid-column:1 / -1}
  .prompt{grid-template-columns:minmax(0,1fr)}
  .copy{width:100%; padding:12px}
}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>

<div class="app" id="app">
  <aside class="rail">
    <div class="rail-head">
      <div class="brand"><h1>Mona <span>Prompt</span> Studio</h1><small id="totals"></small></div>
      <div class="tabs" role="group" aria-label="Zobrazenie">
        <button class="tab" id="tab-videos" aria-pressed="true">Videá</button>
        <button class="tab" id="tab-refs" aria-pressed="false">Reference images</button>
      </div>
      <div id="filters" style="display:flex;flex-direction:column;gap:8px">
        <div class="seg" role="group" aria-label="Slogan" id="seg">
          <button data-s="" aria-pressed="true">Všetko</button>
          <button data-s="A" aria-pressed="false" title="You met me at a very Christmas time of the year">A</button>
          <button data-s="B" aria-pressed="false" title="Santa works for me">B</button>
          <button data-s="C" aria-pressed="false" title="Oh my reindeer!">C</button>
        </div>
        <input type="search" id="q" placeholder="Hľadať: názov, replika, postava…" aria-label="Hľadať">
        <div class="row">
          <select id="cat" aria-label="Téma"></select>
          <select id="fmt" aria-label="Formát"></select>
        </div>
        <div class="row" style="align-items:center">
          <label class="check"><input type="checkbox" id="hideDone"> Skryť hotové</label>
          <span class="count" id="count" style="text-align:right"></span>
        </div>
      </div>
    </div>
    <nav class="list" id="list" aria-label="Zoznam videí"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const V = DATA.videos;
  const byId = Object.fromEntries(V.map(v=>[v.id,v]));
  const FORMATS = {F1:"F1 Cutscéna",F2:"F2 Dialogue wheel",F3:"F3 POV",F4:"F4 Pravidlo troch",F5:"F5 Mockumentary",F6:"F6 Herné HUD",F7:"F7 Seriál",F8:"F8 Chat / bez slov",F9:"F9 Časová os"};
  const store = {
    get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };
  let done = new Set(store.get('mona.done', []));
  let copied = new Set(store.get('mona.copied', []));
  const state = Object.assign({s:"", q:"", cat:"", fmt:"", hideDone:false, view:"videos"}, store.get('mona.filters', {}));

  const $ = id => document.getElementById(id);
  function h(tag, attrs, ...kids){
    const el = document.createElement(tag);
    if (attrs) for (const [k,v] of Object.entries(attrs)){
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()){ if (kid == null) continue; el.append(kid.nodeType ? kid : document.createTextNode(String(kid))); }
    return el;
  }

  // ---------- copy ----------
  let toastT;
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1400); }
  function fallbackCopy(text, anchor){
    const ta = h('textarea',{class:'fallback','aria-label':'Text na skopírovanie'});
    ta.value = text; anchor.after(ta); ta.focus(); ta.select();
    let ok=false; try{ ok = document.execCommand('copy'); }catch(e){}
    if (ok){ ta.remove(); return true; }
    toast('Text je označený – stlač Ctrl+C / Cmd+C'); return false;
  }
  function copy(text, btn, onDone){
    const finish = () => { if (btn){ const o=btn.dataset.label||btn.textContent; btn.dataset.label=o; btn.textContent='SKOPÍROVANÉ ✓'; btn.classList.add('done'); setTimeout(()=>{btn.textContent=o; btn.classList.remove('done');},1500);} toast('Skopírované'); onDone && onDone(); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(finish).catch(()=>{ if (fallbackCopy(text, btn)) finish(); });
    } else if (fallbackCopy(text, btn)) finish();
  }

  // ---------- filters ----------
  const cats = []; V.forEach(v=>{ if(!cats.includes(v.category)) cats.push(v.category); });
  $('cat').append(h('option',{value:''},'Všetky témy'), ...cats.map(c=>h('option',{value:c},c)));
  $('fmt').append(h('option',{value:''},'Všetky formáty'), ...Object.entries(FORMATS).map(([k,l])=>h('option',{value:k},l)));
  $('totals').textContent = V.length + ' videí · ' + V.reduce((a,v)=>a+v.shots.length,0) + ' promptov';

  function saveFilters(){ store.set('mona.filters', {s:state.s,q:state.q,cat:state.cat,fmt:state.fmt,hideDone:state.hideDone}); }
  function syncControls(){
    document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.s===state.s)));
    $('q').value = state.q; $('cat').value = state.cat; $('fmt').value = state.fmt; $('hideDone').checked = state.hideDone;
    $('tab-videos').setAttribute('aria-pressed', String(state.view==='videos'));
    $('tab-refs').setAttribute('aria-pressed', String(state.view==='refs'));
    $('filters').hidden = state.view !== 'videos';
  }
  document.querySelectorAll('#seg button').forEach(b=>b.addEventListener('click',()=>{ state.s=b.dataset.s; saveFilters(); syncControls(); renderList(); }));
  $('q').addEventListener('input', e=>{ state.q=e.target.value; saveFilters(); renderList(); });
  $('cat').addEventListener('change', e=>{ state.cat=e.target.value; saveFilters(); renderList(); });
  $('fmt').addEventListener('change', e=>{ state.fmt=e.target.value; saveFilters(); renderList(); });
  $('hideDone').addEventListener('change', e=>{ state.hideDone=e.target.checked; saveFilters(); renderList(); });
  $('tab-videos').addEventListener('click', ()=>{ state.view='videos'; location.hash = current ? current : ''; route(); });
  $('tab-refs').addEventListener('click', ()=>{ state.view='refs'; location.hash='refs'; route(); });

  function matches(v){
    if (state.s && v.slogan !== state.s) return false;
    if (state.cat && v.category !== state.cat) return false;
    if (state.fmt && v.format !== state.fmt) return false;
    if (state.hideDone && done.has(v.id)) return false;
    if (state.q){
      const q = state.q.toLowerCase();
      const hay = (v.id+' '+v.title+' '+v.meta+' '+v.shots.map(s=>s.desc+' '+s.refs.join(' ')).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  let current = null;
  function renderList(){
    const list = $('list'); list.replaceChildren();
    if (state.view === 'refs'){
      const groups = []; DATA.sheets.forEach(s=>{ if(!groups.includes(s.group)) groups.push(s.group); });
      groups.forEach(g=>{
        list.append(h('div',{class:'group-label'}, g));
        DATA.sheets.forEach((s,i)=>{ if (s.group!==g) return;
          list.append(h('button',{class:'item',onclick:()=>{ const el=document.getElementById('sheet-'+i); el && el.scrollIntoView({block:'start'}); }},
            h('span',{class:'code C', style:'background:var(--ink)'}, 'REF'), h('span',{class:'item-title'}, s.title), h('span')));
        });
      });
      $('count').textContent = DATA.sheets.length + ' promptov';
      return;
    }
    const shown = V.filter(matches);
    $('count').textContent = shown.length + ' / ' + V.length;
    let lastCat = null;
    shown.forEach(v=>{
      const groupKey = v.slogan + '|' + v.category;
      if (groupKey !== lastCat){ list.append(h('div',{class:'group-label'}, v.slogan + ' · ' + v.category)); lastCat = groupKey; }
      const isDone = done.has(v.id);
      list.append(h('button',{class:'item'+(isDone?' done':''), 'aria-current': String(v.id===current), onclick:()=>{ location.hash = v.id; }},
        h('span',{class:'code '+v.slogan}, v.id),
        h('span',{class:'item-title'}, v.title),
        h('span',{class:'item-meta'}, isDone ? h('span',{class:'tick','aria-label':'hotové'},'✓') : (v.format + (v.duration? ' · '+v.duration+'s':'')))
      ));
    });
    if (!shown.length) list.append(h('p',{class:'empty', style:'padding:16px 8px'}, 'Žiadne video nezodpovedá filtrom.'));
  }

  // ---------- detail ----------
  function allPrompts(v){
    return v.shots.map(s=>`${s.id} (${s.time})${s.refs.length? ' · Refs: '+s.refs.join(' '):''}\n${s.prompt}`).join('\n\n');
  }
  function renderVideo(v){
    const main = $('main'); main.replaceChildren();
    const wrap = h('div',{class:'wrap'});
    const isDone = done.has(v.id);
    const doneBtn = h('button',{class:'btn'+(isDone?' ok':''), onclick:()=>{ if (done.has(v.id)) done.delete(v.id); else done.add(v.id); store.set('mona.done',[...done]); renderVideo(v); renderList(); }}, isDone ? '✓ Hotové' : 'Označiť ako hotové');
    wrap.append(
      h('button',{class:'btn small back', onclick:()=>{ location.hash=''; }}, '← Späť na zoznam'),
      h('header',{class:'vhead'},
        h('div',{class:'eyebrow'}, h('span',{class:'code '+v.slogan}, v.id), v.category, v.format && ('· '+(FORMATS[v.format]||v.format)), v.duration && ('· '+v.duration+' s'), '· '+v.shots.length+' záberov'),
        h('h2',null, v.title),
        h('div',{class:'slogan'}, 'Slogan '+v.slogan+': „'+DATA.slogans[v.slogan]+'“'),
        v.meta && h('div',{class:'tc'}, v.meta)
      ),
      h('div',{class:'actions'},
        h('button',{class:'btn primary', onclick:e=>copy(allPrompts(v), e.currentTarget)}, 'Kopírovať všetky prompty'),
        doneBtn,
        h('button',{class:'btn', onclick:()=>step(-1)}, '← Predchádzajúce'),
        h('button',{class:'btn', onclick:()=>step(1)}, 'Ďalšie →')
      )
    );
    if (v.info.length){
      wrap.append(h('div',{class:'info'}, v.info.map(i=>h('div',{class:'info-card'},
        h('div',{class:'label'}, i.label, i.label==='Hook text' ? h('button',{class:'btn small', onclick:e=>copy(i.text, e.currentTarget)}, 'Kopírovať') : null),
        h('p',null,i.text)))));
    }
    const shots = h('div',{class:'shots'});
    v.shots.forEach(s=>{
      const key = v.id+'/'+s.id;
      const card = h('article',{class:'shot'+(copied.has(key)?' copied':''), id:'shot-'+s.id});
      const btn = h('button',{class:'copy', onclick:e=>copy(s.prompt, e.currentTarget, ()=>{ copied.add(key); store.set('mona.copied',[...copied]); card.classList.add('copied'); })}, 'COPY');
      card.append(
        h('div',{class:'shot-top'},
          h('span',{class:'sid'}, s.id), h('span',{class:'tc'}, s.time.replace(/–/,' – ')+' s'),
          copied.has(key) ? h('span',{class:'tick', title:'už skopírované'}, '✓') : null,
          h('span',{class:'refs'}, s.refs.map(r=>h('span',{class:'ref'}, r)),
            s.refs.length ? h('button',{class:'btn small', title:'Kopírovať zoznam referencií', onclick:e=>copy(s.refs.join(' '), e.currentTarget)}, 'Refs') : null)
        ),
        s.desc ? h('div',{class:'sub'}, h('span',null, s.desc)) : null,
        h('div',{class:'prompt'}, h('pre',null, s.prompt), btn)
      );
      shots.append(card);
    });
    wrap.append(h('div',{class:'label'}, 'Zábery – prompt pre každú scénu'), shots);
    if (v.notes.length){
      const notes = h('section',{class:'notes'}, h('div',{class:'label'}, 'Strih, popis a komentár'));
      v.notes.forEach(n=>{
        const copyable = /Popis|Pripnutý|Text na konci|Hook/i.test(n.label);
        notes.append(h('div',{class:'note'}, h('b',null,n.label), h('span',null,n.text), copyable ? h('button',{class:'btn small', onclick:e=>copy(n.text, e.currentTarget)}, 'Kopírovať') : h('span')));
      });
      wrap.append(notes);
    }
    main.append(wrap);
    main.scrollTop = 0; window.scrollTo({top:0});
  }
  function renderRefs(){
    const main = $('main'); main.replaceChildren();
    const wrap = h('div',{class:'wrap'},
      h('header',{class:'vhead'}, h('div',{class:'eyebrow'}, 'Raz vygeneruj, potom prikladaj ku každému záberu'), h('h2',null,'Reference images'),
        h('p',{style:'margin:0;color:var(--muted)'}, 'Postavy (@MONA-A/B/C podľa sloganu, @TASH, @BEV…) a lokácie LOC-01 až LOC-20. Pri Mone nahraď {SLOGAN} textom mikiny.')));
    let lastGroup = null;
    DATA.sheets.forEach((s,i)=>{
      if (s.group !== lastGroup){ wrap.append(h('div',{class:'sheet-group'}, s.group)); lastGroup = s.group; }
      wrap.append(h('article',{class:'shot', id:'sheet-'+i},
        h('div',{class:'shot-top'}, h('span',{class:'sid'}, 'REF'), h('span',null, s.title)),
        h('div',{class:'prompt'}, h('pre',null, s.prompt), h('button',{class:'copy', onclick:e=>copy(s.prompt, e.currentTarget)}, 'COPY'))));
    });
    main.append(wrap);
  }
  function renderStart(){
    const main = $('main'); main.replaceChildren();
    const first = V.find(matches) || V[0];
    renderVideo(first); current = first.id; renderList();
  }
  function step(d){
    const shown = V.filter(matches); const i = shown.findIndex(v=>v.id===current);
    const n = shown[(i + d + shown.length) % shown.length]; if (n) location.hash = n.id;
  }

  // ---------- routing ----------
  function route(){
    const id = decodeURIComponent(location.hash.slice(1));
    const app = $('app');
    if (id === 'refs'){ state.view='refs'; syncControls(); renderList(); renderRefs(); app.classList.add('detail'); return; }
    state.view = 'videos'; syncControls();
    if (byId[id]){ current = id; renderList(); renderVideo(byId[id]); app.classList.add('detail'); }
    else { app.classList.remove('detail'); if (!current || window.matchMedia('(min-width:821px)').matches) renderStart(); else renderList(); }
  }
  window.addEventListener('hashchange', route);
  syncControls(); route();
})();
</script>

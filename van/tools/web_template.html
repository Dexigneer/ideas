<title>[ EXIT ] Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: production console – episode list on the left, one episode as a stack of shot cards on the right; each card = subtitle "screen" + copyable prompt. */
:root {
  --bg: #eceff5;
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --ink: #161d2e;
  --muted: #5b6579;
  --line: #d4dae6;
  --accent: #0b8a4c;
  --accent-ink: #ffffff;
  --accent-soft: #dcf3e6;
  --screen: #10141f;
  --sub: #ffe94a;
  --type-a: #c9472c;
  --type-b: #2f6fd1;
  --type-c: #8a52c7;
  --focus: #2f6fd1;
  --font-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1120; --surface: #141b2d; --surface-2: #10172a; --ink: #e6eaf3; --muted: #93a0b9;
    --line: #26304a; --accent: #2fd585; --accent-ink: #06200f; --accent-soft: #123826;
    --screen: #05070d; --sub: #ffe94a; --type-a: #ff7a5c; --type-b: #6aa2ff; --type-c: #c191f5; --focus: #6aa2ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1120; --surface: #141b2d; --surface-2: #10172a; --ink: #e6eaf3; --muted: #93a0b9;
  --line: #26304a; --accent: #2fd585; --accent-ink: #06200f; --accent-soft: #123826;
  --screen: #05070d; --sub: #ffe94a; --type-a: #ff7a5c; --type-b: #6aa2ff; --type-c: #c191f5; --focus: #6aa2ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand .exit { color: var(--accent); }
.brand small { font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 1px solid transparent; background: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--muted); text-decoration: none; font-size: 14px; }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-current="page"] { color: var(--ink); border-color: var(--line); background: var(--surface-2); }
.top .spacer { flex: 1; }
.stat { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* shell */
.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100% - 60px); }
.side { border-right: 1px solid var(--line); background: var(--surface-2); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); height: calc(100vh - 57px - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: 14px 12px 40px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
.main { min-width: 0; padding-block: 20px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main-inner { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

.search { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 3px 9px; border-radius: 999px; font-size: 12px; cursor: pointer; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.season-h { font-family: var(--font-display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 10px 4px 4px; }
.ep-list { display: flex; flex-direction: column; gap: 2px; }
.ep-item { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; text-decoration: none; color: var(--ink); font-size: 13.5px; }
.ep-item:hover { background: var(--surface); }
.ep-item[aria-current="true"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); }
.ep-num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ep-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ep-prog { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ep-prog.done { color: var(--accent); font-weight: 600; }
.tdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.tA { background: var(--type-a); } .tB { background: var(--type-b); } .tC { background: var(--type-c); }
.empty { color: var(--muted); font-size: 13px; padding: 8px; }

/* episode header */
.ep-head { display: flex; flex-direction: column; gap: 12px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; background: var(--surface); color: var(--muted); font-weight: 500; white-space: nowrap; }
.pill.type { color: var(--surface); border: 0; }
.pill.type.A { background: var(--type-a); } .pill.type.B { background: var(--type-b); } .pill.type.C { background: var(--type-c); }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 4vw, 36px); line-height: 1.1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 .no { color: var(--muted); font-weight: 600; margin-right: 10px; font-variant-numeric: tabular-nums; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: 14px; }
.facts dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.facts dd { margin: 0; max-width: 68ch; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.ref { font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--accent-soft); color: var(--ink); border: 1px solid var(--line); white-space: nowrap; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.copied { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: default; }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: 1; min-width: 80px; max-width: 220px; }
.progress span { display: block; height: 100%; background: var(--accent); }
.prog-wrap { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* shot card */
.shots { display: flex; flex-direction: column; gap: 14px; }
.shot { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
.shot.is-done { border-color: var(--accent); }
.shot-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.shot-no { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .06em; }
.shot-t { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.shot-h .grow { flex: 1; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; }
.chk input { width: 16px; height: 16px; accent-color: var(--accent); }
.shot-b { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px; padding: 14px; }
.screen { background: var(--screen); border-radius: 6px; aspect-ratio: 4 / 3; max-width: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; position: relative; }
.screen .who { font-family: var(--font-mono); font-size: 10.5px; color: #8f9ab0; letter-spacing: .08em; text-transform: uppercase; }
.screen .line { font-family: var(--font-body); font-weight: 600; font-size: 14px; line-height: 1.3; color: var(--sub); text-align: center; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 0 #000; text-wrap: balance; }
.screen .line.none { color: #6d7690; font-weight: 400; font-style: italic; text-shadow: none; }
.screen .hud { position: absolute; top: 8px; right: 8px; left: 50%; text-align: right; font-family: var(--font-display); font-size: 9.5px; letter-spacing: .06em; color: #7ff0b4; line-height: 1.2; }
.side-info { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cues { display: flex; flex-wrap: wrap; gap: 6px; }
.cue { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); }
.meta-row { font-size: 13px; color: var(--muted); }
.meta-row b { color: var(--ink); font-weight: 600; }
.prompt-wrap { display: flex; flex-direction: column; gap: 8px; padding: 0 14px 14px; }
pre.prompt { margin: 0; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; max-height: 260px; overflow: auto; }
pre.prompt.open { max-height: none; }
.prompt-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.prompt-actions .btn.primary { min-width: 170px; justify-content: center; }
.link-btn { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; text-decoration: underline; padding: 4px; }

/* sheets */
.sheet-grid { display: flex; flex-direction: column; gap: 16px; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.sheet h2 { font-family: var(--font-display); font-size: 20px; margin: 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; text-wrap: balance; }
.sheet details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13.5px; margin-top: 8px; }
.kv div:nth-child(odd) { color: var(--muted); font-weight: 600; }
.block-label { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lead { color: var(--muted); max-width: 68ch; margin: 0; }
h2.page { font-family: var(--font-display); font-size: 28px; margin: 0; }

/* guide */
.steps { counter-reset: s; display: flex; flex-direction: column; gap: 12px; padding: 0; margin: 0; list-style: none; }
.steps li { counter-increment: s; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 14px 56px; position: relative; max-width: 78ch; }
.steps li::before { content: counter(s); position: absolute; left: 16px; top: 13px; font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--accent); }
.steps h3 { margin: 0 0 4px; font-size: 16px; }
.steps p, .steps ul { margin: 4px 0 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; z-index: 40; pointer-events: none; opacity: 0; transition: opacity .15s; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
.list-toggle { display: none; }
.sr-copy { position: fixed; left: -9999px; top: 0; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .side.collapsed { display: none; }
  .list-toggle { display: inline-flex; }
  .shot-b { grid-template-columns: minmax(0, 1fr); }
  .screen { max-width: 320px; }
  .top { gap: 8px 12px; }
  .stat { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<header class="top">
  <div class="brand"><span class="exit">[ EXIT ]</span> Studio <small>VAN · 130 epizód</small></div>
  <nav class="tabs" aria-label="Sekcie">
    <a class="tab" href="#ep-001" data-tab="ep">Epizódy</a>
    <a class="tab" href="#postavy" data-tab="postavy">Postavy</a>
    <a class="tab" href="#lokacie" data-tab="lokacie">Lokácie</a>
    <a class="tab" href="#navod" data-tab="navod">Návod</a>
  </nav>
  <div class="spacer"></div>
  <div class="stat" id="globalStat"></div>
</header>

<div class="shell">
  <aside class="side" id="side" aria-label="Zoznam epizód">
    <input class="search" id="q" type="search" placeholder="Hľadať názov, repliku, postavu…" autocomplete="off">
    <div class="chips" id="seasonChips"></div>
    <div class="chips" id="typeChips"></div>
    <div id="epList"></div>
  </aside>
  <main class="main"><div class="main-inner" id="view"></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const DATA = /*__DATA__*/null;
const EPS = DATA.episodes;
const TYPE_NAME = { A: "Cutscéna", B: "Tutorial level", C: "Idle · motivácia" };
const SEASONS = [...new Set(EPS.map(e => e.season))];
const CUE = { DROP: "🎵 beat drop", PING: "🔔 sale ping", OUT: "🔇 výpadok hudby", LOOP: "↩ tvrdý strih → loop" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(3, "0");
const t1 = n => n.toFixed(1).replace(".", ",");

let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem("van-done") || "[]")); } catch (e) {}
const saveDone = () => { try { localStorage.setItem("van-done", JSON.stringify([...done])); } catch (e) {} };
let filt = { q: "", season: "", type: "" };
try { Object.assign(filt, JSON.parse(localStorage.getItem("van-filt") || "{}")); } catch (e) {}
const saveFilt = () => { try { localStorage.setItem("van-filt", JSON.stringify({ season: filt.season, type: filt.type })); } catch (e) {} };

const epDone = e => e.scenes.filter(s => done.has(e.num + "-" + s.n)).length;

/* ---------- copy ---------- */
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1600); }
function flash(btn, label) {
  if (!btn) return;
  const old = btn.dataset.label || btn.textContent;
  btn.dataset.label = old; btn.textContent = label; btn.classList.add("copied");
  setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1400);
}
function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.className = "sr-copy"; ta.setAttribute("readonly", "");
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta); return ok;
}
function copyText(text, btn, what) {
  const okMsg = () => { flash(btn, "✓ Skopírované"); toast(what + " skopírované"); };
  try {
    navigator.clipboard.writeText(text).then(okMsg, () => { fallbackCopy(text) ? okMsg() : toast("Kopírovanie zlyhalo – označ text a stlač Ctrl+C"); });
  } catch (e) { fallbackCopy(text) ? okMsg() : toast("Kopírovanie zlyhalo – označ text a stlač Ctrl+C"); }
}

/* ---------- sidebar ---------- */
function chipRow(el, items, key) {
  el.innerHTML = items.map(([v, l]) => `<button class="chip" data-k="${key}" data-v="${v}" aria-pressed="${filt[key] === v}">${esc(l)}</button>`).join("");
}
function renderChips() {
  chipRow($("#seasonChips"), [["", "Všetky"], ...SEASONS.map(s => [s, s])], "season");
  chipRow($("#typeChips"), [["", "A + B + C"], ["A", "A · cutscéna"], ["B", "B · tutorial"], ["C", "C · idle"]], "type");
}
function matches(e) {
  if (filt.season && e.season !== filt.season) return false;
  if (filt.type && e.type !== filt.type) return false;
  if (!filt.q) return true;
  const q = filt.q.toLowerCase();
  if (String(e.num).includes(q) || e.title.toLowerCase().includes(q) || e.premise.toLowerCase().includes(q)) return true;
  return e.scenes.some(s => (s.line + " " + s.who).toLowerCase().includes(q));
}
function renderList() {
  const cur = currentEp();
  const list = EPS.filter(matches);
  let html = "", last = "";
  for (const e of list) {
    if (e.season !== last) { html += `<div class="season-h">${esc(e.seasonName)}</div>`; last = e.season; }
    const d = epDone(e), all = e.scenes.length;
    html += `<a class="ep-item" href="#ep-${pad(e.num)}" aria-current="${cur && cur.num === e.num}">
      <span class="ep-num">${pad(e.num)}</span>
      <span class="ep-title"><span class="tdot t${e.type}" title="Typ ${e.type}"></span>${esc(e.title)}</span>
      <span class="ep-prog ${d === all ? "done" : ""}">${d === all ? "✓" : d ? d + "/" + all : ""}</span></a>`;
  }
  $("#epList").innerHTML = html || `<div class="empty">Nič sa nenašlo. Skús iné slovo alebo zruš filter.</div>`;
  const totalScenes = EPS.reduce((a, e) => a + e.scenes.length, 0);
  const doneEps = EPS.filter(e => epDone(e) === e.scenes.length).length;
  $("#globalStat").textContent = `${doneEps}/130 epizód hotových · ${done.size}/${totalScenes} záberov`;
}

/* ---------- episode view ---------- */
function currentEp() { const m = location.hash.match(/^#ep-(\d{3})$/); return m ? EPS.find(e => e.num === +m[1]) : null; }
function refName(c) { return DATA.locNames[c] ? `${c}.png` : `${c}.png`; }
function shotCard(e, s) {
  const id = e.num + "-" + s.n, isDone = done.has(id);
  const hud = s.cues.filter(c => c.startsWith("HUD:")).map(c => c.slice(4).trim());
  const cues = s.cues.filter(c => !c.startsWith("HUD:")).map(c => CUE[c] || (c.startsWith("SFX:") ? "🔊 " + c.slice(4).trim() : c));
  return `<article class="shot ${isDone ? "is-done" : ""}" id="shot-${s.n}">
    <div class="shot-h">
      <span class="shot-no">ZÁBER ${s.n}</span>
      <span class="shot-t">${t1(s.a)}–${t1(s.b)} s</span>
      <span class="pill">${esc(s.shotName)}</span>
      <span class="pill">${esc(s.loc)} · ${esc(DATA.locNames[s.loc])}</span>
      <span class="grow"></span>
      <label class="chk"><input type="checkbox" id="chk-${id}" data-done="${id}" ${isDone ? "checked" : ""}> Vygenerované</label>
    </div>
    <div class="shot-b">
      <div class="screen" aria-label="Náhľad titulku">
        <div class="who">${esc(s.who || "bez repliky")}</div>
        ${hud.length ? `<div class="hud">${hud.map(esc).join("<br>")}</div>` : ""}
        <div class="line ${s.line ? "" : "none"}">${s.line ? esc(s.line) : "(bez repliky)"}</div>
      </div>
      <div class="side-info">
        <div class="meta-row"><b>Nahraj ako reference:</b></div>
        <div class="refs">${s.refs.map(r => `<span class="ref">${esc(refName(r))}</span>`).join("")}</div>
        ${cues.length ? `<div class="meta-row"><b>Strih / zvuk:</b></div><div class="cues">${cues.map(c => `<span class="cue">${esc(c)}</span>`).join("")}</div>` : ""}
        ${hud.length ? `<div class="meta-row"><b>HUD text:</b> ${hud.map(esc).join(" · ")}</div>` : ""}
      </div>
    </div>
    <div class="prompt-wrap">
      <pre class="prompt" id="p-${s.n}">${esc(s.prompt)}</pre>
      <div class="prompt-actions">
        <button class="btn primary" data-copy="prompt" data-n="${s.n}">Kopírovať prompt</button>
        ${s.line ? `<button class="btn" data-copy="line" data-n="${s.n}">Kopírovať repliku</button>` : ""}
        <button class="link-btn" data-expand="${s.n}">Zobraziť celý</button>
      </div>
    </div>
  </article>`;
}
function renderEp(e) {
  const idx = EPS.indexOf(e), prev = EPS[idx - 1], next = EPS[idx + 1];
  const d = epDone(e), all = e.scenes.length;
  const facts = [["Premisa", e.premise], ["Emócia", e.emo], ["Naučí sa", e.edu], ["Indícia", e.clue], ["Loop", e.loop]].filter(x => x[1]);
  $("#view").innerHTML = `
  <section class="ep-head">
    <div class="toolbar">
      <button class="btn list-toggle" data-act="list">☰ Zoznam epizód</button>
      ${prev ? `<a class="btn" href="#ep-${pad(prev.num)}">← ${pad(prev.num)}</a>` : ""}
      ${next ? `<a class="btn" href="#ep-${pad(next.num)}">${pad(next.num)} →</a>` : ""}
    </div>
    <div class="crumbs">
      <span class="pill">${esc(e.seasonName)}</span>
      <span class="pill type ${e.type}">${e.type} · ${TYPE_NAME[e.type]}</span>
      <span class="pill">~${e.dur} s</span>
      <span class="pill">${all} záberov</span>
      ${e.cta ? `<span class="pill">+ end card SAVE GAME?</span>` : ""}
    </div>
    <h1><span class="no">#${pad(e.num)}</span>${esc(e.title)}</h1>
    <dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <div class="refs"><span class="meta-row"><b>Reference images pre celé video:</b></span>
      ${[...e.chars, ...e.locs].map(r => `<span class="ref">${esc(refName(r))}</span>`).join("")}</div>
    <div class="toolbar">
      <button class="btn primary" data-copy="all">Kopírovať všetky prompty</button>
      <button class="btn" data-copy="srt">Titulky SRT</button>
      <button class="btn" data-copy="hud" ${e.hud ? "" : "disabled"}>HUD SRT</button>
      <button class="btn" data-copy="caption">Popis + hashtagy</button>
    </div>
    <div class="prog-wrap"><div class="progress"><span style="width:${(d / all) * 100}%"></span></div>${d}/${all} záberov vygenerovaných</div>
  </section>
  <section class="shots">${e.scenes.map(s => shotCard(e, s)).join("")}</section>
  <div class="toolbar">
    ${prev ? `<a class="btn" href="#ep-${pad(prev.num)}">← #${pad(prev.num)} ${esc(prev.title)}</a>` : ""}
    ${next ? `<a class="btn" href="#ep-${pad(next.num)}">#${pad(next.num)} ${esc(next.title)} →</a>` : ""}
  </div>`;
}

/* ---------- sheets ---------- */
function codeOf(sec) { const r = sec.rows.find(r => r[0] === "Kód"); return r ? r[1].replace("@", "") : ""; }
function sheetCard(sec, code) {
  const rows = sec.rows.filter(r => r[0] && r[0] !== "Kód");
  const text = sec.rows.filter(r => !r[0]).map(r => r[1]).join(" ");
  return `<article class="sheet">
    <h2>${esc(sec.title)} ${code ? `<span class="ref">ulož ako ${esc(code)}.png</span>` : ""}</h2>
    ${text ? `<p class="lead">${esc(text)}</p>` : ""}
    ${rows.length ? `<details><summary>Profil postavy (${rows.length} položiek)</summary><div class="kv">${rows.map(r => `<div>${esc(r[0])}</div><div>${esc(r[1])}</div>`).join("")}</div></details>` : ""}
    ${sec.blocks.map((b, i) => `<div class="block-label">${esc(b.label)}</div>
      <pre class="prompt open">${esc(b.text)}</pre>
      <div class="prompt-actions"><button class="btn primary" data-copy-text="${esc(b.text)}">Kopírovať prompt</button></div>`).join("")}
  </article>`;
}
function renderChars() {
  const st = DATA.style[0];
  $("#view").innerHTML = `<h2 class="page">Postavy</h2>
  <p class="lead">Každú postavu vygeneruj raz: turnaround (celá postava) a expression sheet (tvár). Ulož pod kódom, napr. <span class="ref">VAN.png</span> a <span class="ref">VAN-face.png</span>. Tieto súbory potom nahrávaš ku každému záberu.</p>
  <div class="sheet-grid">${st ? sheetCard({ ...st, title: "Spoločný štýl + negatívny prompt" }, "") : ""}
  ${DATA.characters.map(c => sheetCard(c, codeOf(c))).join("")}</div>`;
}
function renderLocs() {
  $("#view").innerHTML = `<h2 class="page">Lokácie</h2>
  <p class="lead">Každú lokáciu vygeneruj raz ako prázdnu scénu bez ľudí a ulož pod kódom, napr. <span class="ref">L01.png</span>.</p>
  <div class="sheet-grid">${DATA.locations.map(l => sheetCard(l, l.title.slice(0, 3))).join("")}</div>`;
}
function renderGuide() {
  $("#view").innerHTML = `<h2 class="page">Návod</h2>
  <ol class="steps">
    <li><h3>Raz: vygeneruj reference images</h3><p>V záložke <a href="#postavy">Postavy</a> a <a href="#lokacie">Lokácie</a> skopíruj prompty do generátora obrázkov. Výsledky ulož presne pod kódom: <span class="ref">VAN.png</span>, <span class="ref">JUNE.png</span> … <span class="ref">L01.png</span> … <span class="ref">L12.png</span>. Skontroluj, že nápisy [ EXIT ], VISITOR a EMPLOYEE sú čitateľné.</p></li>
    <li><h3>Otvor epizódu</h3><p>Vľavo vyber epizódu alebo ju vyhľadaj podľa názvu, čísla či repliky. Hore vidíš, ktoré obrázky video potrebuje.</p></li>
    <li><h3>Záber po zábere</h3><p>Pri každom zábere nahraj obrázky zo zoznamu <b>Nahraj ako reference</b>. Klikni na <b>Kopírovať prompt</b>, vlož ho do video generátora (Kling, Veo, Runway, Hailuo) a nastav pomer 4:3 a dĺžku 3 – 5 s. Potom zaškrtni <b>Vygenerované</b>. Postup sa ukladá v tomto prehliadači.</p></li>
    <li><h3>Strih</h3><p>Zábery poskladaj v poradí. Tlačidlo <b>Titulky SRT</b> skopíruje titulky. Vlož ich do súboru <span class="ref">.srt</span> a importuj do CapCutu (žlté písmo, čierny obrys). Pri type B pridaj aj <b>HUD SRT</b> ako druhú stopu hore. Zvukové značky (beat drop, sale ping, výpadok hudby) sú pri každom zábere.</p></li>
    <li><h3>Publikovanie</h3><p><b>Popis + hashtagy</b> skopíruj do TikToku a Instagramu. Pri videách s označením „end card SAVE GAME?“ pridaj na koniec 1,5 s kartu <span class="ref">SAVE GAME? → [ EXIT ] link in bio</span>.</p></li>
  </ol>
  <p class="lead">Ak generátor berie menej obrázkov: najprv hovoriaca postava, potom ostatné postavy, nakoniec lokácia (prompt ju aj tak podrobne opisuje). Pri detailoch tváre (CU, ECU, CAM) použi verziu <span class="ref">-face.png</span>.</p>`;
}

/* ---------- routing ---------- */
function route() {
  const h = location.hash;
  const tab = h.startsWith("#ep-") || !h ? "ep" : h.slice(1);
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-current", t.dataset.tab === tab ? "page" : "false"));
  const side = $("#side");
  if (tab === "postavy") renderChars();
  else if (tab === "lokacie") renderLocs();
  else if (tab === "navod") renderGuide();
  else { const e = currentEp() || EPS[0]; renderEp(e); if (window.innerWidth <= 860) side.classList.add("collapsed"); }
  if (tab !== "ep" && window.innerWidth <= 860) side.classList.add("collapsed");
  renderList();
  window.scrollTo(0, 0);
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.k) { filt[b.dataset.k] = b.dataset.v; saveFilt(); renderChips(); renderList(); return; }
  if (b.dataset.act === "list") { $("#side").classList.toggle("collapsed"); return; }
  if (b.dataset.expand) { const p = document.getElementById("p-" + b.dataset.expand); p.classList.toggle("open"); b.textContent = p.classList.contains("open") ? "Zbaliť" : "Zobraziť celý"; return; }
  if (b.hasAttribute("data-copy-text")) { copyText(b.dataset.copyText, b, "Prompt"); return; }
  const e = currentEp() || EPS[0]; const k = b.dataset.copy; if (!k) return;
  if (k === "prompt") { const s = e.scenes[b.dataset.n - 1]; copyText(s.prompt, b, `Prompt záberu ${s.n}`); }
  else if (k === "line") { const s = e.scenes[b.dataset.n - 1]; copyText(s.line, b, "Replika"); }
  else if (k === "all") copyText(e.scenes.map(s => `===== ZÁBER ${s.n} (${t1(s.a)}–${t1(s.b)} s) =====\n${s.prompt}`).join("\n\n"), b, "Všetky prompty");
  else if (k === "srt") copyText(e.srt, b, "Titulky");
  else if (k === "hud") copyText(e.hud, b, "HUD titulky");
  else if (k === "caption") copyText(e.caption, b, "Popis");
});
document.addEventListener("change", ev => {
  const c = ev.target; if (!c.dataset || !c.dataset.done) return;
  c.checked ? done.add(c.dataset.done) : done.delete(c.dataset.done); saveDone();
  c.closest(".shot").classList.toggle("is-done", c.checked);
  const e = currentEp() || EPS[0], d = epDone(e), all = e.scenes.length;
  const pw = document.querySelector(".prog-wrap");
  if (pw) pw.innerHTML = `<div class="progress"><span style="width:${(d / all) * 100}%"></span></div>${d}/${all} záberov vygenerovaných`;
  renderList();
});
$("#q").addEventListener("input", ev => { filt.q = ev.target.value.trim(); renderList(); });
document.addEventListener("keydown", ev => {
  if (ev.target.matches("input, textarea")) return;
  const e = currentEp(); if (!e) return; const i = EPS.indexOf(e);
  if (ev.key === "ArrowRight" && EPS[i + 1]) location.hash = "ep-" + pad(EPS[i + 1].num);
  if (ev.key === "ArrowLeft" && EPS[i - 1]) location.hash = "ep-" + pad(EPS[i - 1].num);
});
window.addEventListener("hashchange", route);
renderChips();
route();
</script>
